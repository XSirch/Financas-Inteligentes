kind = "mobile"
previewPath = "/"
title = "Áuria — Finanças pessoais"
description = "Aplicativo Android pessoal de finanças, planejamento e patrimônio, com serviço privado em VPS, integração Pluggy e agente Codex autenticado por OAuth com a assinatura ChatGPT do usuário."
version = "1.0.0"
id = "artifacts/auria"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25377

[services.development]
run = "pnpm --filter @workspace/auria run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/auria", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/auria", "run", "serve" ]

[services.env]
PORT = "25377"
BASE_PATH = "/"
